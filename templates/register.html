<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendIQ – Register</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #000000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e0e0e0;
            padding: 20px 0;
        }

        .card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo-icon {
            font-size: 48px;
            display: block;
            margin-bottom: 8px;
        }
        .logo h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffd700, #ff6b35);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }
        .logo p {
            color: rgba(255,255,255,0.5);
            font-size: 0.85rem;
            margin-top: 4px;
        }

        .flash-messages { margin-bottom: 20px; }
        .flash {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.88rem;
            margin-bottom: 8px;
        }
        .flash.error   { background: rgba(255,80,80,0.15);  border: 1px solid rgba(255,80,80,0.3);  color: #ff8080; }
        .flash.success { background: rgba(80,255,120,0.12); border: 1px solid rgba(80,255,120,0.3); color: #80ffaa; }
        .flash.info    { background: rgba(100,180,255,0.12);border: 1px solid rgba(100,180,255,0.3);color: #a0d0ff; }

        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: rgba(255,255,255,0.6);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 12px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
        }
        input:focus {
            border-color: rgba(255,215,0,0.5);
            background: rgba(255,255,255,0.1);
        }
        input::placeholder { color: rgba(255,255,255,0.3); }

        .hint {
            font-size: 0.78rem;
            color: rgba(255,255,255,0.35);
            margin-top: 5px;
        }

        .btn-primary {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #ffd700, #ff9500);
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            color: #1a1a2e;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            letter-spacing: 0.3px;
            margin-top: 8px;
        }
        .btn-primary:hover  { opacity: 0.9; }
        .btn-primary:active { transform: scale(0.98); }

        .divider {
            text-align: center;
            margin: 24px 0;
            color: rgba(255,255,255,0.3);
            font-size: 0.85rem;
            position: relative;
        }
        .divider::before, .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: rgba(255,255,255,0.1);
        }
        .divider::before { left: 0; }
        .divider::after  { right: 0; }

        .link-row {
            text-align: center;
            font-size: 0.9rem;
            color: rgba(255,255,255,0.5);
        }
        .link-row a {
            color: #ffd700;
            text-decoration: none;
            font-weight: 600;
        }
        .link-row a:hover { text-decoration: underline; }

        /* Password strength indicator */
        #strengthBar {
            height: 4px;
            border-radius: 2px;
            margin-top: 8px;
            background: rgba(255,255,255,0.1);
            transition: all 0.3s;
        }
        #strengthLabel {
            font-size: 0.75rem;
            margin-top: 4px;
            color: rgba(255,255,255,0.4);
        }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">
        <span class="logo-icon">💰</span>
        <h1>SpendIQ</h1>
        <p>Create your free account</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="flash-messages">
                {% for category, message in messages %}
                    <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('register') }}">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Choose a username"
                   required minlength="3" autocomplete="username">
            <div class="hint">At least 3 characters</div>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="your@email.com"
                   required autocomplete="email">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Create a password"
                   required minlength="6" autocomplete="new-password"
                   oninput="checkStrength(this.value)">
            <div id="strengthBar"></div>
            <div id="strengthLabel"></div>
        </div>

        <div class="form-group">
            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password"
                   placeholder="Repeat your password" required autocomplete="new-password">
        </div>

        <button type="submit" class="btn-primary">Create Account</button>
    </form>

    <div class="divider">or</div>

    <div class="link-row">
        Already have an account? <a href="{{ url_for('login') }}">Log in</a>
    </div>
</div>

<script>
function checkStrength(pw) {
    const bar   = document.getElementById('strengthBar');
    const label = document.getElementById('strengthLabel');
    if (!pw) { bar.style.width = '0'; label.textContent = ''; return; }

    let score = 0;
    if (pw.length >= 6)  score++;
    if (pw.length >= 10) score++;
    if (/[A-Z]/.test(pw)) score++;
    if (/[0-9]/.test(pw)) score++;
    if (/[^A-Za-z0-9]/.test(pw)) score++;

    const levels = [
        { w: '20%',  color: '#ff4444', text: 'Weak' },
        { w: '40%',  color: '#ff8800', text: 'Fair' },
        { w: '60%',  color: '#ffcc00', text: 'Good' },
        { w: '80%',  color: '#88cc00', text: 'Strong' },
        { w: '100%', color: '#44bb44', text: 'Very strong' },
    ];
    const lv = levels[Math.min(score - 1, 4)] || levels[0];
    bar.style.width      = lv.w;
    bar.style.background = lv.color;
    label.textContent    = lv.text;
    label.style.color    = lv.color;
}
</script>
</body>
</html>
