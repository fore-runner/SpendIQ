# SpendIQ – Render deployment manifest
# Deploys the Flask app (gunicorn) + a free PostgreSQL database in one click.
# https://render.com/docs/reference/blueprint-spec

databases:
  - name: spendiq-db
    plan: free
    ipAllowList: []

services:
  - type: web
    name: spendiq
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PGHOST
        fromDatabase:
          name: spendiq-db
          property: host
      - key: PGPORT
        fromDatabase:
          name: spendiq-db
          property: port
      - key: PGDATABASE
        fromDatabase:
          name: spendiq-db
          property: database
      - key: PGUSER
        fromDatabase:
          name: spendiq-db
          property: user
      - key: PGPASSWORD
        fromDatabase:
          name: spendiq-db
          property: password
      - key: SECRET_KEY
        generateValue: true